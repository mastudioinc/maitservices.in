<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | MA IT SERVICES</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="effects.css">
    <link rel="stylesheet" href="ui-upgrade.css">
    <script src="appearance.js"></script>
    <script src="accessibility.js"></script>
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>
</head>

<body>

    <div id="auth-screen">

        <div class="auth-box">
            <button
    type="button"
    id="authThemeToggle"
    class="auth-theme-toggle"
    aria-label="Switch theme"
    title="Switch Light / Dark Mode"
>
    <i class="fas fa-moon"></i>
</button>

            <img src="images/logo.png" alt="MA IT SERVICES">

            <div id="reset-section">

                <h2>Reset Password</h2>

                <p>Enter your new password</p>

                <form id="reset-password-form">

                    <input
                        type="password"
                        id="new-password"
                        placeholder="New Password"
                        aria-label="New password"
                        autocomplete="new-password"
                        required
                    >

                    <input
                        type="password"
                        id="confirm-new-password"
                        placeholder="Confirm New Password"
                        aria-label="Confirm new password"
                        autocomplete="new-password"
                        required
                    >

                    <button type="submit">
                        Update Password
                    </button>

                </form>

                <p id="reset-message" role="status" aria-live="polite"></p>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="effects.js"></script>
    <script src="language.js"></script>
<script>
function shouldRememberAuthPreferences() {
    return localStorage.getItem("maRememberPreferences") !== "false";
}

function readAuthPreference(key, fallbackValue) {
    const storage = shouldRememberAuthPreferences()
        ? localStorage
        : sessionStorage;
    const value = storage.getItem(key);

    return value === null ? fallbackValue : value;
}

function writeAuthPreference(key, value) {
    if (shouldRememberAuthPreferences()) {
        localStorage.setItem(key, value);
        sessionStorage.removeItem(key);
    } else {
        sessionStorage.setItem(key, value);
        localStorage.removeItem(key);
    }
}

    const savedResetTheme =
    readAuthPreference("maThemeMode", "dark");

const savedResetAccent =
    readAuthPreference("maAccentStyle", "purple");

document.documentElement.setAttribute(
    "data-theme",
    savedResetTheme
);

document.documentElement.setAttribute(
    "data-accent",
    savedResetAccent
);

const authThemeToggle =
    document.getElementById("authThemeToggle");

function updateResetThemeIcon() {
    if (!authThemeToggle) return;

    const icon = authThemeToggle.querySelector("i");

    let currentTheme =
        document.documentElement.getAttribute("data-theme");

    if (currentTheme === "system") {
        currentTheme =
            window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
    }

    if (currentTheme === "light") {
        icon.classList.remove("fa-sun");
        icon.classList.add("fa-moon");
        authThemeToggle.title = "Switch to Dark Mode";
    } else {
        icon.classList.remove("fa-moon");
        icon.classList.add("fa-sun");
        authThemeToggle.title = "Switch to Light Mode";
    }
}

if (authThemeToggle) {
    authThemeToggle.addEventListener("click", () => {

        let currentTheme =
            document.documentElement.getAttribute("data-theme");

        if (currentTheme === "system") {
            currentTheme =
                window.matchMedia("(prefers-color-scheme: light)").matches
                    ? "light"
                    : "dark";
        }

        const newTheme =
            currentTheme === "light" ? "dark" : "light";

        document.documentElement.setAttribute(
            "data-theme",
            newTheme
        );

        writeAuthPreference(
            "maThemeMode",
            newTheme
        );

        updateResetThemeIcon();
    });
}

updateResetThemeIcon();
const SUPABASE_URL = "https://bssjncbsxnynsriqunrf.supabase.co";
const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_bNNHzk3Af3ME696lO3Qz9g_ANYWLmOO";

const resetSupabase = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

const resetForm = document.getElementById("reset-password-form");
const newPassword = document.getElementById("new-password");
const confirmNewPassword = document.getElementById("confirm-new-password");
const resetMessage = document.getElementById("reset-message");
const resetParams = new URLSearchParams(
    window.location.hash.substring(1)
);

const resetError = resetParams.get("error");

if (resetError) {
    resetForm.style.display = "none";

    resetMessage.textContent =
        "This password reset link has already been used or has expired. Please request a new reset link.";
}

resetForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const password = newPassword.value;
    const confirmPassword = confirmNewPassword.value;

    resetMessage.textContent = "";

    if (password.length < 8) {
        resetMessage.textContent =
            "Password must be at least 8 characters.";
        return;
    }

    if (password !== confirmPassword) {
        resetMessage.textContent =
            "Passwords do not match.";
        return;
    }

    resetMessage.textContent = "Updating password...";

    const { data: sessionData } =
        await resetSupabase.auth.getSession();

    if (!sessionData.session) {
        resetMessage.textContent =
            "Reset link is invalid or expired. Please request a new password reset link.";
        return;
    }

    const { error } = await resetSupabase.auth.updateUser({
        password: password
    });

    if (error) {
        resetMessage.textContent = error.message;
        console.error("Password update failed:", error);
        return;
    }

    resetMessage.textContent =
        "Password updated successfully. Redirecting to Sign In...";

    await resetSupabase.auth.signOut();
    window.MA_VISUAL_EFFECTS?.sync();

    setTimeout(() => {
        window.location.href = "index.html";
    }, 1500);
});
</script>
</body>
</html>
