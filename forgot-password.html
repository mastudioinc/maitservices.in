<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | MA IT SERVICES</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="effects.css">
    <link rel="stylesheet" href="ui-upgrade.css">
    <script src="appearance.js"></script>
    <script src="accessibility.js"></script>
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>
</head>

<body>

    <div id="auth-screen">

        <div class="auth-box">
            <button
    type="button"
    id="authThemeToggle"
    class="auth-theme-toggle"
    aria-label="Switch theme"
    title="Switch Light / Dark Mode"
>
    <i class="fas fa-moon"></i>
</button>

            <img src="images/logo.png" alt="MA IT SERVICES">

            <div id="forgot-section">

                <h2>Forgot Password</h2>

                <p>
                    Enter the email address associated with your account
                </p>

                <form id="forgot-password-form">

                    <input
                        type="email"
                        id="forgot-email"
                        placeholder="Email Address"
                        aria-label="Email address"
                        autocomplete="email"
                        required
                    >

                    <button type="submit">
                        Send Reset Link
                    </button>

                </form>

                <button id="forgot-back-login" type="button">
                    Back to Sign In
                </button>

                <p id="forgot-message" role="status" aria-live="polite"></p>

            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
    <script src="effects.js"></script>
    <script src="language.js"></script>

    <script>
function shouldRememberAuthPreferences() {
    return localStorage.getItem("maRememberPreferences") !== "false";
}

function readAuthPreference(key, fallbackValue) {
    const storage = shouldRememberAuthPreferences()
        ? localStorage
        : sessionStorage;
    const value = storage.getItem(key);

    return value === null ? fallbackValue : value;
}

function writeAuthPreference(key, value) {
    if (shouldRememberAuthPreferences()) {
        localStorage.setItem(key, value);
        sessionStorage.removeItem(key);
    } else {
        sessionStorage.setItem(key, value);
        localStorage.removeItem(key);
    }
}

const savedForgotTheme =
    readAuthPreference("maThemeMode", "dark");

const savedForgotAccent =
    readAuthPreference("maAccentStyle", "purple");

document.documentElement.setAttribute(
    "data-theme",
    savedForgotTheme
);

document.documentElement.setAttribute(
    "data-accent",
    savedForgotAccent
);

const authThemeToggle =
    document.getElementById("authThemeToggle");

function updateForgotThemeIcon() {
    if (!authThemeToggle) return;

    const icon = authThemeToggle.querySelector("i");

    let currentTheme =
        document.documentElement.getAttribute("data-theme");

    if (currentTheme === "system") {
        currentTheme =
            window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
    }

    if (currentTheme === "light") {
        icon.classList.remove("fa-sun");
        icon.classList.add("fa-moon");
        authThemeToggle.title = "Switch to Dark Mode";
    } else {
        icon.classList.remove("fa-moon");
        icon.classList.add("fa-sun");
        authThemeToggle.title = "Switch to Light Mode";
    }
}

if (authThemeToggle) {
    authThemeToggle.addEventListener("click", () => {

        let currentTheme =
            document.documentElement.getAttribute("data-theme");

        if (currentTheme === "system") {
            currentTheme =
                window.matchMedia("(prefers-color-scheme: light)").matches
                    ? "light"
                    : "dark";
        }

        const newTheme =
            currentTheme === "light" ? "dark" : "light";

        document.documentElement.setAttribute(
            "data-theme",
            newTheme
        );

        writeAuthPreference(
            "maThemeMode",
            newTheme
        );

        updateForgotThemeIcon();
    });
}

updateForgotThemeIcon();
        const SUPABASE_URL =
            "https://bssjncbsxnynsriqunrf.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_bNNHzk3Af3ME696lO3Qz9g_ANYWLmOO";


        const forgotSupabase = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


        const forgotForm =
            document.getElementById("forgot-password-form");

        const forgotEmail =
            document.getElementById("forgot-email");

        const forgotMessage =
            document.getElementById("forgot-message");

        const forgotBackLogin =
            document.getElementById("forgot-back-login");


        forgotForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();

                const email = forgotEmail.value.trim();

                if (!email) {
                    forgotMessage.textContent =
                        "Please enter your email address.";
                    return;
                }


                forgotMessage.textContent =
                    "Sending password reset link...";


                const resetPasswordUrl =
    "https://mastudioinc.github.io/maitservices.in/reset-password.html";

                const { error } =
                    await forgotSupabase.auth.resetPasswordForEmail(
                        email,
                        {
                            redirectTo: resetPasswordUrl
                        }
                    );


                if (error) {

                    forgotMessage.textContent =
                        error.message;

                    console.error(
                        "Password reset failed:",
                        error
                    );

                    return;
                }


                forgotMessage.textContent =
                    "Password reset link has been sent to your email.";

            }
        );


        forgotBackLogin.addEventListener(
            "click",
            () => {

                window.location.href = "index.html";

            }
        );

    </script>

</body>
</html>
